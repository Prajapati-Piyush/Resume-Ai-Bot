<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020617" />
    
    <!-- Primary SEO Meta Tags -->
    <title>PrepPilot — AI-Powered Interview Preparation & Resume Analysis</title>
    <meta
      name="description"
      content="Prepare for your next job interview with AI. Upload your resume, analyze any job description, pinpoint skill gaps, and get personalized technical and HR interview questions in seconds."
    />
    <meta name="keywords" content="AI interview preparation, AI interview prep, AI interview questions, resume analysis AI, resume-based interview preparation, technical interview preparation AI, HR interview preparation AI, job description analysis" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="PrepPilot — AI-Powered Interview Preparation & Resume Analysis" />
    <meta property="og:description" content="Turn any job description and resume into a customized interview preparation report in under 60 seconds with PrepPilot AI." />
    <meta property="og:site_name" content="PrepPilot" />
    <meta property="og:image" content="https://preppilot.ai/preppilot-logo.svg" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PrepPilot — AI-Powered Interview Preparation & Resume Analysis" />
    <meta name="twitter:description" content="Turn any job description and resume into a customized interview preparation report in under 60 seconds with PrepPilot AI." />
    <meta name="twitter:image" content="https://preppilot.ai/preppilot-logo.svg" />
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash.
      (function () {
        try {
          var pref = localStorage.getItem('preppilot.theme')
          var dark =
            pref === 'dark' ||
            (pref !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
