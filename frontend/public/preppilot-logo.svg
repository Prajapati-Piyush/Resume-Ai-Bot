<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 52" fill="none">
  <defs>
    <linearGradient id="pp-logo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>
    <linearGradient id="pp-text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>

  <!-- Logo Mark -->
  <rect x="2" y="2" width="48" height="48" rx="13" fill="url(#pp-logo-bg)" />
  
  <g transform="translate(10, 10)">
    <!-- Aerodynamic Forward P Loop -->
    <path
      d="M5 4.5H16.5C20.6421 4.5 24 7.85786 24 12C24 16.1421 20.6421 19.5 16.5 19.5H5V4.5Z"
      stroke="#ffffff"
      stroke-width="3.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Mast -->
    <path
      d="M5 3.5V28.5"
      stroke="#ffffff"
      stroke-width="4"
      stroke-linecap="round"
    />

    <!-- Precision Readiness Target -->
    <path
      d="M12 12.5L16 16.5L25 7"
      stroke="#2dd4bf"
      stroke-width="3.2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- Wordmark -->
  <g transform="translate(62, 34)" font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', sans-serif">
    <text font-size="24" font-weight="700" letter-spacing="-0.03em" fill="#0f172a">Prep</text>
    <text x="56" font-size="24" font-weight="700" letter-spacing="-0.03em" fill="url(#pp-text-grad)">Pilot</text>
  </g>
</svg>
